<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS-锐机综合站</title>
    <link rel="icon" href="files/images/rms-logo-rotating.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn {
            border-radius: 20px;
        }
        .navbar-toggler {
            border-radius: 20px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        @keyframes spinIn {
            from {
                opacity: 0;
                transform: rotate(-360deg) scale(0.5);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: rotate(0deg) scale(1);
                filter: blur(0);
            }
        }
        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .nav-item {
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        .nav-item:nth-child(1) { animation-delay: 0.1s; }
        .nav-item:nth-child(2) { animation-delay: 0.2s; }
        .nav-item:nth-child(3) { animation-delay: 0.3s; }
        .nav-item:nth-child(4) { animation-delay: 0.4s; }
        .nav-item:nth-child(5) { animation-delay: 0.5s; }
        .nav-item:nth-child(6) { animation-delay: 0.6s; }
        .nav-item:nth-child(7) { animation-delay: 0.7s; }
        .icon-container {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        .icon-container:nth-child(1) { animation-delay: 1.2s; }
        .icon-container:nth-child(2) { animation-delay: 1.4s; }
        body > div {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        body > div:nth-child(2) { animation-delay: 0.8s; }
        body > div:nth-child(3) { animation-delay: 1.0s; }
        body > div:nth-child(4) { animation-delay: 1.2s; }
        .logo-spin {
            opacity: 0;
            animation: spinIn 1s ease-out forwards 1.2s, slowSpin 10s linear infinite 2.2s;
        }
        .App {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState } = React;
        
        const Navbar = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            const toggleMenu = () => {
                setIsMenuOpen(!isMenuOpen);
            };
            
            return (
                <nav className="navbar navbar-expand-lg bg-body-tertiary sticky-top">
                    <div className="container-fluid">
                        <a className="navbar-brand" href="/">
                            <img alt="" height="25" src="files/images/rms-logo.svg" width="25" />
                            锐机综合站
                        </a>
                        <button 
                            className="navbar-toggler" 
                            type="button" 
                            onClick={toggleMenu}
                            aria-controls="navbarSupportedContent" 
                            aria-expanded={isMenuOpen} 
                            aria-label="Toggle navigation"
                        >
                            <span className="navbar-toggler-icon"></span>
                        </button>
                        <div className={`collapse navbar-collapse ${isMenuOpen ? 'show' : ''}`} id="navbarSupportedContent">
                            <ul className="navbar-nav me-auto mb-2 mb-lg-0">
                                <li className="nav-item">
                                    <a aria-current="page" className="nav-link active" href="/">主页</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="/community">社交媒体账号</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="/news/list">视频</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="/live">直播</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="/about">关于RMS锐机主站</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="https://rfs.rjtec.site">锐机文件站</a>
                                </li>
                                <li className="nav-item">
                                    <a className="nav-link" href="https://rejclass.framer.website">锐机班级站</a>
                                </li>
                            </ul>
                            <ul className="navbar-nav">
                                <li className="nav-item">
                                    <a className="btn btn-secondary" href="/en/">Switch to English</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            );
        };
        
        const MainContent = () => {
            return (
                <>
                    <div className="bg-light p-4">
                        <h5 className="text-body-emphasis h4">使用RTOS(Based on TurboWarp)</h5>
                        <a className="btn btn-primary me-2" target="_blank" rel="noopener noreferrer" href="https://rfs.rjtec.site/autoredirect?link=rtos">立即查看</a>
                        <a className="btn btn-primary" target="_blank" rel="noopener noreferrer" href="https://xw44n-my.sharepoint.com/:u:/g/personal/rej_xw44n_onmicrosoft_com/IQDLpCHmgwf8Q7uAt0PolXieAYph7YGvNiT_9QFJ5ODrUR0?e=8tg2kP">下载离线包</a>
                    </div>
                    <div className="bg-light p-4">
                        <h5 className="text-body-emphasis h4">锐机LLM</h5>
                        <span className="badge bg-secondary me-2">AD</span>
                        <a className="btn btn-primary" href="/ad" target="_blank" rel="noopener noreferrer">立即试用开发版Beta</a>
                    </div>
                </>
            );
        };
        
        const WelcomeSection = () => {
            const [isAccordionOpen, setIsAccordionOpen] = useState(false);
            const [formData, setFormData] = useState({
                email: '',
                suggestion: ''
            });
            
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };
            
            const handleSubmit = (e) => {
                e.preventDefault();
                console.log('表单提交:', formData);
                alert('感谢您的反馈！');
                setFormData({ email: '', suggestion: '' });
            };
            
            const toggleAccordion = () => {
                setIsAccordionOpen(!isAccordionOpen);
            };
            
            return (
                <div className="p-5 mb-4 bg-body-tertiary rounded-3">
                    <div className="container-fluid py-5">
                        <img 
                            alt="" 
                            height="150" 
                            src="files/images/rms-logo.svg" 
                            width="150" 
                            className="logo-spin mb-3"
                        />
                        <h1 className="display-5 fw-bold">欢迎来到锐机综合站</h1>
                        <p className="col-md-8 fs-4">这里为你提供综合性的锐机信息</p>
                        <a className="btn btn-primary" href="changelogview.html">更新日志(CHANGELOG)</a>
                        
                        <div className="accordion accordion-flush mt-3" id="accordionFlushExample">
                            <div className="accordion-item">
                                <h2 className="accordion-header" id="flush-headingOne">
                                    <button 
                                        aria-controls="flush-collapseOne" 
                                        aria-expanded={isAccordionOpen} 
                                        className="btn btn-primary"
                                        onClick={toggleAccordion}
                                        type="button"
                                    >
                                        提供反馈
                                    </button>
                                </h2>
                                <div 
                                    aria-labelledby="flush-headingOne" 
                                    className={`accordion-collapse collapse ${isAccordionOpen ? 'show' : ''}`}
                                    id="flush-collapseOne"
                                >
                                    <div className="accordion-body">
                                        <form onSubmit={handleSubmit}>
                                            <div className="mb-3">
                                                <label className="form-label" htmlFor="email-input">电邮联系地址</label>
                                                <input 
                                                    type="email" 
                                                    name="email" 
                                                    className="form-control" 
                                                    id="email-input"
                                                    value={formData.email}
                                                    onChange={handleInputChange}
                                                    required
                                                />
                                                <div className="form-text" id="email-help">我们不会将你的电邮分享给他人，或做其他用处</div>
                                            </div>
                                            <div className="mb-3">
                                                <label className="form-label" htmlFor="suggestion-input">留下你的建议</label>
                                                <input 
                                                    type="text" 
                                                    name="suggestion" 
                                                    className="form-control" 
                                                    id="suggestion-input"
                                                    value={formData.suggestion}
                                                    onChange={handleInputChange}
                                                />
                                            </div>
                                            <button className="btn btn-primary" type="submit">提交</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        
        const Footer = () => {
            return (
                <footer className="mt-5 py-3 bg-light text-center">
                    <div>
                        版本号-β.25.1227.1<br />
                        <a href="https://github.com/RejTech/rejmainsite">Github项目 - 前往Github源码区</a>
                    </div>
                    
                    <div style={{ display: 'flex', justifyContent: 'center', gap: '20px', margin: '8px 0' }}>
                        <img src="files/images/DAEcn.png" alt="DAE" className="icon-container" style={{ height: '24px' }} />
                        <img src="files/images/MLScn.png" alt="MLS" className="icon-container" style={{ height: '24px' }} />
                    </div>
                    
                    <div>
                        <a href="licenseview.html">Apache2.0许可证 —— 版权所有 锐机科技2026</a>
                    </div>
                </footer>
            );
        };
        
        const App = () => {
            return (
                <div className="App">
                    <Navbar />
                    <MainContent />
                    <WelcomeSection />
                    <Footer />
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
