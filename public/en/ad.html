    <style>
        .btn {
            border-radius: 20px;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        /* 椤甸潰鍏冪礌鍔ㄧ敾 */
        a.btn,
        h1,
        iframe {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        a.btn:first-of-type {
            animation-delay: 0.1s;
        }
        h1 {
            animation-delay: 0.3s;
        }
        iframe {
            animation-delay: 0.5s;
        }
        a.btn:last-of-type {
            animation-delay: 0.7s;
        }
    </style>
</head>
